name: vitap_nexus_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  google_fonts: ^8.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  web: ^1.1.1
  flutter_animate: ^4.5.2
  lib_vtop:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  lottie: ^3.3.2
  meta: ^1.16.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  share_plus: ^13.3.0
  file_saver: ^0.4.0
  file_picker: ^12.0.0-beta.7
  pdf: ^3.11.1
  printing: ^5.13.2
  image: ^4.12.0
  html: ^0.15.7
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  device_info_plus: ^13.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/pfp/
    - assets/images/logo/
    - assets/lottie/
    - assets/weather_icons/
    - assets/faculty_list.json
    - assets/weights.json
